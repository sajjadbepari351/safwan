name: Career Radar public vacancy discovery

on:
  schedule:
    - cron: "0 2,14 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: career-radar-public-discovery
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Check scanner syntax
        run: python -m py_compile scripts/scan_linkedin.py
      - name: Discover public vacancy leads
        run: python scripts/scan_linkedin.py
      - name: Validate generated JSON
        run: |
          python -m json.tool linkedin-leads.json > /dev/null
          python -m json.tool pending-vacancies.json > /dev/null
      - name: Commit refreshed discovery feeds
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add linkedin-leads.json pending-vacancies.json
          if git diff --cached --quiet; then
            echo "No discovery-feed changes."
          else
            git commit -m "Refresh public vacancy discovery feeds"
            git push
          fi
