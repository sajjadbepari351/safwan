name: LinkedIn public-post discovery

on:
  schedule:
    - cron: "0 2,14 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: linkedin-public-post-discovery
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Scan public search-index RSS feeds
        run: python scripts/scan_linkedin.py
      - name: Commit updated LinkedIn leads
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add linkedin-leads.json
          if git diff --cached --quiet; then
            echo "No LinkedIn lead changes."
          else
            git commit -m "Refresh public LinkedIn vacancy leads"
            git push
          fi
