name: Scheduled vacancy discovery and LinkedIn public leads

on:
  schedule:
    - cron: "0 2,14 * * *" # Twice daily: 08:00 and 20:00 Bangladesh time
  workflow_dispatch:

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Validate scanner syntax
        run: python -m py_compile scripts/discover_jobs.py scripts/scan_linkedin.py

      - name: Collect RSS discovery leads
        run: python scripts/discover_jobs.py

      - name: Collect public LinkedIn and job-board leads
        run: python scripts/scan_linkedin.py

      - name: Validate discovery JSON
        run: |
          python -m json.tool pending-vacancies.json > /dev/null
          python -m json.tool linkedin-leads.json > /dev/null

      - name: Commit updated discovery list
        run: |
          git config user.name "Career Radar BD Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pending-vacancies.json linkedin-leads.json
          if ! git diff --cached --quiet; then
            git commit -m "Update daily vacancy discovery leads"
            git push
          else
            echo "No discovery changes."
          fi
